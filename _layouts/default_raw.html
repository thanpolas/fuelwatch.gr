<!doctype html>
<html lang="{{ site.lang | default: 'el' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>

  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <meta name="author" content="Thanasis Polychronakis">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@{{ site.twitter_username }}">

  {% if page.page_js %}<meta name="fuel-data-url" content="{{ site.data_url }}">{% endif %}

  {% include google-analytics.html %}

  <link rel="icon" href="{{ '/assets/fuelwatch-favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">

  {% if page.page_js %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
  {% endif %}
</head>
<body>
  {% include header.html %}

  {{ content }}

  {% include footer.html %}

  {% if page.page_js %}
  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
  <script type="module" src="{{ '/assets/js/pages/' | append: page.page_js | append: '.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  {% endif %}
</body>
</html>
